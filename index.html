<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thế giới của Hải</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial, sans-serif;

    background:
        radial-gradient(circle at 20% 20%, #ffffff 0%, transparent 25%),
        radial-gradient(circle at 80% 80%, #74b9ff 0%, transparent 30%),
        linear-gradient(135deg,#74b9ff,#81ecec,#dff9fb);

    overflow:hidden;

}


/* Các bong bóng nền */

.bubble{

    position:absolute;

    border-radius:50%;

    background:rgba(255,255,255,0.25);

    animation:bay 8s infinite ease-in-out;

}

.b1{
    width:80px;
    height:80px;
    left:10%;
    bottom:-100px;
}

.b2{
    width:120px;
    height:120px;
    left:70%;
    bottom:-150px;
    animation-delay:2s;
}

.b3{
    width:50px;
    height:50px;
    left:45%;
    bottom:-100px;
    animation-delay:4s;
}

@keyframes bay{

    0%{
        transform:translateY(0);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    100%{
        transform:translateY(-110vh);
        opacity:0;
    }

}


/* Khung chính */

.container{

    position:relative;

    width:90%;
    max-width:600px;

    padding:45px 30px;

    text-align:center;

    background:rgba(255,255,255,0.85);

    backdrop-filter:blur(15px);

    border-radius:30px;

    box-shadow:
        0 20px 50px rgba(0,0,0,0.18);

    border:2px solid rgba(255,255,255,0.8);

    z-index:10;

}


/* Tiêu đề */

h1{

    font-size:42px;

    color:#0984e3;

    margin-bottom:15px;

    animation:
        title 2s infinite alternate;

}

@keyframes title{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-5px);
    }

}


/* Nội dung */

p{

    font-size:19px;

    color:#555;

    margin-bottom:30px;

}


/* Nút */

button{

    position:relative;

    padding:16px 40px;

    font-size:20px;

    font-weight:bold;

    color:white;

    border:none;

    border-radius:50px;

    cursor:pointer;

    background:
        linear-gradient(135deg,#00b894,#0984e3);

    box-shadow:
        0 8px 20px rgba(9,132,227,0.35);

    transition:
        transform 0.2s,
        box-shadow 0.2s;

}

button:hover{

    transform:translateY(-4px) scale(1.05);

    box-shadow:
        0 12px 30px rgba(9,132,227,0.5);

}

button:active{

    transform:scale(0.95);

}


/* Doraemon */

#anh{

    display:none;

    width:300px;

    max-width:90%;

    margin:35px auto 10px;

    border-radius:25px;

    border:6px solid white;

    box-shadow:
        0 15px 35px rgba(0,0,0,0.25);

}


/* Hiệu ứng nhảy */

.nhay{

    display:block !important;

    animation:

        xuatHien 0.6s ease,

        uoneo 0.8s infinite linear;

}


@keyframes xuatHien{

    0%{

        opacity:0;

        transform:
            scale(0)
            rotate(-20deg);

    }

    70%{

        transform:
            scale(1.15)
            rotate(10deg);

    }

    100%{

        opacity:1;

        transform:
            scale(1)
            rotate(0deg);

    }

}


@keyframes uoneo{

    0%{

        transform:
            translateY(0)
            rotate(0deg)
            scale(1);

    }

    25%{

        transform:
            translateY(-20px)
            rotate(-5deg)
            scale(1.05);

    }

    50%{

        transform:
            translateY(0)
            rotate(5deg)
            scale(0.98);

    }

    75%{

        transform:
            translateY(-15px)
            rotate(-4deg)
            scale(1.03);

    }

    100%{

        transform:
            translateY(0)
            rotate(0deg)
            scale(1);

    }

}


/* Dòng chữ dưới ảnh */

#message{

    display:none;

    margin-top:15px;

    font-size:22px;

    font-weight:bold;

    color:#0984e3;

    animation:
        message 1s ease;

}

@keyframes message{

    from{

        opacity:0;

        transform:translateY(20px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}


/* Footer */

.footer{

    margin-top:25px;

    font-size:13px;

    color:#999;

}

</style>

</head>


<body>


<!-- Bong bóng -->

<div class="bubble b1"></div>
<div class="bubble b2"></div>
<div class="bubble b3"></div>


<!-- Nội dung chính -->

<div class="container">


    <h1>Xin chào Hải 😄</h1>


    <p>
        Chào mừng bạn đến với thế giới nhỏ của Hải!
        <br>
        Nhấn nút bên dưới để triệu hồi Doraemon 🤖💙
    </p>


    <button onclick="HienAnh()">

        ✨ Triệu hồi Doraemon ✨

    </button>


    <img
        id="anh"
        src="https://jbagy.me/wp-content/uploads/2025/03/Hinh-anh-doremon-cute-1.jpg"
    >


    <div id="message">

        🎉 Doraemon đã xuất hiện! 🎉

    </div>


    <div class="footer">

        Made with ❤️ for Hải

    </div>


</div>


<script>


function HienAnh(){

    let img =
        document.getElementById("anh");

    let message =
        document.getElementById("message");


    img.style.display = "block";

    img.classList.remove("nhay");


    // Bắt trình duyệt chạy lại animation

    void img.offsetWidth;


    img.classList.add("nhay");


    message.style.display = "block";


}


</script>


</body>

</html>
